<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Clone Netflix</title>
</head>
<body>
    <header>
        <nav>
            <div id="netflix-logo">
                <img src="assets/img/netflix-logo.png" alt="Netflix Logo" id="logo-netflix">
            </div>
            <ul>
                <li>
                    <a href="#">
                        Início
                    </a>
                </li>
                <li>
                    <a href="#">
                        Séries
                    </a>
                </li>
                <li>
                    <a href="#">
                        Filmes
                    </a>
                </li>
                <li>
                    <a href="#">
                        Bombando
                    </a>
                </li>
                <li>
                    <a href="#">
                        Minha Lista
                    </a>
                </li>
                <li>
                    <a href="#">
                        Navegar por idiomas
                    </a>
                </li>
            </ul>
            <div>
                <ul>
                    <li>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </li>
                    <li>
                        <i class="fa-regular fa-bell"></i>
                    </li>
                    <li>
                        <img src="assets/img/icone_usuario_netflix.jpg" alt="Ícone de Usuário" id="icone-usuario">
                    </li>
                </ul>
            </div>
        </nav>
        <div> 
            <img src="assets/img/capa-filmes-de-terror-netflix-halloween-2026.jpg" alt="Capa Filme Netflix" id="capa-filme-netflix">
        </div>
    </header>
    <main>
        <div id="container">
            <div>
                <h2>Populares na Netflix</h2>
                <ul class="carrossel-fotos">
                    <li>
                        <img src="assets/img/aguas.jpg" alt="Águas">
                    </li>
                    <li>
                        <img src="assets/img/aviao_caido.jpg" alt="Avião Caído">
                    </li>
                    <li>
                        <img src="assets/img/beco_cidade.jpg" alt="Beco Cidade" >
                    </li>
                    <li>
                        <img src="assets/img/bloco_papeis.jpg" alt="Bloco Papeis">
                    </li>
                    <li>
                        <img src="assets/img/cafe_e_cama.jpg" alt="Café e Cama">
                    </li>
                </ul>
            </div>
            <div>
                <h2>Em alta</h2>
                <ul class="carrossel-fotos">
                    <li>
                        <img src="assets/img/carro_antigo.jpg" alt="Carro Antigo" >
                    </li>
                    <li>
                        <img src="assets/img/cidade_vista_aviao.jpg" alt="Cidade Vista Avião">
                    </li>
                    <li>
                        <img src="assets/img/costa_e_mar.jpg" alt="Costa e Mar">
                    </li>
                    <li>
                        <img src="assets/img/cowboy_contra_luz.jpg" alt="Cowboy Contra a Luz">
                    </li>
                    <li>
                        <img src="assets/img/estrada_arborizada.jpg" alt="Estrada Arborizada">
                    </li>
                </ul>
            </div>
            <div>
                <h2>Minha lista</h2>
                <ul class="carrossel-fotos">
                    <li>
                        <img src="assets/img/flor_que_voa.jpg" alt="Flor que Voa">
                    </li>
                    <li>
                        <img src="assets/img/floresta_arvores_longas.jpg" alt="Floresta de Árvores Longas">
                    </li>
                    <li>
                        <img src="assets/img/floresta_pinheiros_neblina.jpg" alt="Floresta de Pinheiros na Neblina">
                    </li>
                    <li>
                        <img src="assets/img/livros_abertos.jpg" alt="Livros Abertos">
                    </li>
                    <li>
                        <img src="assets/img/mar_de_nuvens.jpg" alt="Mar de Nuvens">
                    </li>
                </ul>
            </div>
        </div>
    </main>
    <footer>
        <div></div>
    </footer>
</body>
</html>
