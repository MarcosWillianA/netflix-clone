<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Clone Netflix</title>
</head>
<body>
    <header>
        <nav>
            <div id="menu-esquerdo">
                <img src="assets/img/netflix-logo.png" alt="Netflix Logo" id="netflix-logo">
                <ul>
                    <li>Home</li>
                    <li>Início</li>
                    <li>Séries</li>
                    <li>Minha Lista</li>
                    <li>Bombando</li>
                    <li>Navegar por idiomas</li>
                </ul>
            </div>
            <ul>
                <li>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </li>
                <li>
                    <i class="fa-regular fa-bell"></i>
                </li>
                <li>
                    <img src="assets/img/icone_usuario_netflix.jpg" alt="Ícone Usuário netflix" id="icone-usuario">
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="container">
            <section id="primeira-section">
                <div id="botao-assistir">
                    <img src="assets/img/netflix-filme-slogan.png" alt="Netflix Filme" id="netflix-filme-logo">
                    <div id="botoes-de-assistir">
                        <button><i class="fa-solid fa-play"></i> Assistir </button>
                        <button id="mais-informacoes">Mais Informações</button>
                    </div>
                </div>
            </section>
        </div>
        <section id="container-carrosseis">
            <h2>Populares na Netflix</h2>
            <ul class="container-carrossel">
                <li class="itens-carrossel">
                    <img src="assets/img/aguas.jpg" alt="Águas">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/aviao_caido.jpg" alt="Avião Caído">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/beco_cidade.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/bloco_papeis.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/cafe_e_cama.jpg" alt="">
                </li>
            </ul>
            <h2>Em Alta</h2>
            <ul>
                <li class="itens-carrossel">
                    <img src="assets/img/carro_antigo.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/cidade_vista_aviao.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/costa_e_mar.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/cowboy_contra_luz.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/estrada_arborizada.jpg" alt="">
                </li>
            </ul>
            <h2>Minha Lista</h2>
            <ul>
                <li class="itens-carrossel">
                    <img src="assets/img/flor_que_voa.jpg" alt="">
                </li>
                <li class="itens-carrossel">
                    <img src="assets/img/floresta_arvores_longas.jpg" alt="">
                </li>
                <li class="itens-carrossel"></li>
                <li class="itens-carrossel"></li>
                <li class="itens-carrossel"></li>
            </ul>
        </section>
    </main>
    <footer></footer>
</body>
</html>
